<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>19份真实点云 · 清理前后确认</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#233047;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:27px;margin:0 0 8px}h2{margin:0;font-size:19px}.muted{color:#67758a}.summary,.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:end;margin:18px 0}.summary strong{color:#185f91;font-size:23px}label{display:flex;flex-direction:column;gap:4px;font-size:13px}select,input,button{font:inherit;padding:8px;border:1px solid #bdc9d5;border-radius:6px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#175f91;color:white}article{background:white;border:1px solid #d8e0e8;border-radius:10px;margin:20px 0;padding:18px}.head{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.stats p{margin:3px 0}.picture{border:0;padding:0;width:100%;background:white;cursor:zoom-in}.picture img{display:block;width:100%}.warn{color:#885719}.paths input{width:100%;font-size:12px}.paths label{margin:8px 0}dialog{width:min(1500px,96vw);border:0;border-radius:10px;padding:18px}dialog img{width:100%}dialog::backdrop{background:#17253bc9}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #6ba3d4;outline-offset:2px}@media(max-width:600px){main{padding:14px}.stats{grid-template-columns:1fr}h1{font-size:23px}.head select{max-width:100%}}</style></head>
<body><main>
<h1>真实点云 · 保守清理与人工确认</h1>
<p class="muted">上排为原版，下排为保守清理版。两排使用相同坐标、视角和显示范围；红叉为自动分离点，橙色为待复核点，橙色点仍保留在清理版中。</p>
<div id="summary" class="summary"></div>
<p>这不是地面、墙面或附属物的自动语义识别。只分离极小且远离有支持点群的分量；低邻域支持、分离小分量和高度1%/99%分位以外的点只触发复核，不因此自动删除。橙色点可能是真实屋脊、墙面或地面，不代表已判为杂点。不同的大块结构全部保留，不只取最大连通块。</p>
<p class="muted">最低观测点不是已确认的地面，清理前后高度跨度均不是建筑总高真值。已保留原始坐标框架与尺寸，未重新缩放、补墙或预测参数。</p>
<div class="controls"><label>初步人工类别<select id="category"><option value="">全部类别</option></select></label><label>清理情况<select id="filter"><option value="">全部样本</option><option value="removed">有自动分离点</option><option value="review">有保留待复核点</option><option value="held">自动分离暂停，需手动清理</option></select></label><label>查找编号<input id="search" placeholder="例如 23164"></label><button id="export" class="primary" type="button">导出已确认版本清单</button></div>
<p id="saveStatus" class="muted"></p><div id="cards"></div>
</main><dialog id="zoom"><button id="closeZoom" type="button">关闭</button><img id="zoomImage" alt="清理前后三视图放大"></dialog>
<script id="clean-data" type="application/json">__CLEANING_DATA__</script><script>
"use strict";
const data=JSON.parse(document.getElementById('clean-data').textContent),byId=id=>document.getElementById(id);
const key='real-clean-review:'+data.method+':'+data.created_utc;
let reviews={},persistent=true;try{reviews=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){persistent=false}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const choices=[['pending','待确认'],['cleaned','确认使用保守清理版'],['original','确认保留原版'],['manual','需要继续手动清理'],['exclude','暂不用于验证']];
const getReview=r=>reviews[r.id]||'pending';
for(const c of [...new Set(data.records.map(r=>r.human_class))]){const option=document.createElement('option');option.value=c;option.textContent=data.classes[c]||c;byId('category').append(option)}
function render(){
 const confirmed=data.records.filter(r=>['cleaned','original'].includes(getReview(r))).length;
 byId('summary').innerHTML=`<span>候选 <strong>${data.records.length}</strong> 份</span><span>自动分离 <strong>${data.records.reduce((n,r)=>n+r.separated_points,0)}</strong> 点</span><span>保留待复核 <strong>${data.records.reduce((n,r)=>n+r.review_kept_points,0)}</strong> 点</span><span>已确认版本 <strong>${confirmed}</strong> 份</span>`;
 byId('saveStatus').textContent=persistent?'确认结果保存在当前浏览器。确认后导出清单，再用对应路径进入插件验证。':'浏览器存储不可用，请在关闭前导出确认清单。';
 const rows=data.records.filter(r=>(!byId('category').value||r.human_class===byId('category').value)&&r.name.toLowerCase().includes(byId('search').value.trim().toLowerCase())&&(!byId('filter').value||(byId('filter').value==='removed'?r.separated_points>0:byId('filter').value==='review'?r.review_kept_points>0:r.audit.automatic_removal_held)));
 byId('cards').innerHTML=rows.map(r=>`<article data-id="${esc(r.id)}"><div class="head"><h2>${esc(r.name)} · ${esc(data.classes[r.human_class]||r.human_class)}</h2><label>你确认的处理版本<select data-review>${choices.map(([id,text])=>`<option value="${id}" ${getReview(r)===id?'selected':''}>${text}</option>`).join('')}</select></label></div><div class="stats"><div><p>原版：${r.before_points.toLocaleString()} 点</p><p>原版XYZ跨度：${r.before_span.map(x=>x.toFixed(2)).join(' × ')}</p></div><div><p>保守版：${r.after_points.toLocaleString()} 点；分离 ${r.separated_points} 点</p><p>保守版XYZ跨度：${r.after_span.map(x=>x.toFixed(2)).join(' × ')}</p></div></div><p class="warn">保留待复核 ${r.review_kept_points} 点；这些点可能是地面、附属物、稀疏墙面或离群点，尚未作语义判断。${r.audit.automatic_removal_held?'分离候选过多或支持不足，本样本暂停自动删点。':''}</p><button class="picture" data-zoom="${esc(r.image)}" type="button" aria-label="放大${esc(r.name)}的清理对照"><img loading="lazy" src="${esc(r.image)}" alt="上排原版、下排保守版，红色分离、橙色保留待确认"></button><details class="paths"><summary>点云路径、分离点及参数记录</summary>${[['original','原版XYZ'],['cleaned','保守清理版XYZ'],['separated','自动分离点XYZ'],['review_points','待复核点XYZ（仍在保守版中）']].map(([id,title])=>`<label>${title}<input readonly value="${esc(r.files[id]||'无')}" aria-label="${title}"></label>`).join('')}<p class="muted">原副本：${esc(r.source_input_path)}。原地理坐标=当前局部XYZ+(${r.original_origin.map(v=>v.toFixed(5)).join(', ')}）。范围数值保持源单位。邻域连接参考半径：${r.audit.neighbor_radius?.toFixed(4)||'—'}；自动分离距离阈值：${r.audit.automatic_gap_threshold?.toFixed(4)||'—'}。清理未依据v10预测结果。</p></details></article>`).join('')||'<p>没有符合当前筛选条件的样本。</p>';
}
for(const id of ['category','filter','search'])byId(id).addEventListener(id==='search'?'input':'change',render);
byId('cards').addEventListener('change',event=>{if(!event.target.matches('[data-review]'))return;reviews[event.target.closest('[data-id]').dataset.id]=event.target.value;try{localStorage.setItem(key,JSON.stringify(reviews))}catch(e){persistent=false}render()});
byId('cards').addEventListener('focusin',event=>{if(event.target.matches('input[readonly]'))event.target.select()});
byId('cards').addEventListener('click',event=>{const button=event.target.closest('[data-zoom]');if(button){byId('zoomImage').src=button.dataset.zoom;byId('zoom').showModal()}});byId('closeZoom').onclick=()=>byId('zoom').close();
byId('export').onclick=()=>{const rows=data.records.filter(r=>['cleaned','original'].includes(getReview(r))).map(r=>({...r,accepted_version:getReview(r),predict_input:r.files[getReview(r)]}));if(!rows.length){alert('请先确认至少一份使用原版或保守清理版。');return}const value={purpose:'real_validation_only_not_training',method:data.method,exported_utc:new Date().toISOString(),count:rows.length,records:rows};const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='真实点云清理确认清单.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
