<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圆塔中段剖面</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7f9; color: #20252b; font: 15px/1.5 "Microsoft YaHei", sans-serif; letter-spacing: 0; }
  main { max-width: 1100px; margin: auto; padding: 24px; }
  h1 { font-size: 23px; margin: 0 0 20px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px 24px; padding-bottom: 20px; border-bottom: 1px solid #d4dbe2; }
  label { display: grid; gap: 6px; }
  input[type=number] { width: 135px; padding: 7px; border: 1px solid #aeb9c5; border-radius: 4px; font: inherit; }
  .bulge { min-width: 230px; flex: 1; }
  input[type=range] { width: 100%; accent-color: #007c83; }
  output { font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; margin: 16px 0 6px; font-size: 13px; }
  .legend label { display: flex; align-items: center; gap: 6px; }
  .swatch { display: inline-block; width: 20px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--color); }
  canvas { display: block; width: 100%; height: 440px; background: white; }
  #error { color: #b12832; min-height: 24px; margin: 8px 0; }
  @media (max-width: 600px) { main { padding: 16px; } canvas { height: 330px; } .bulge { flex-basis: 100%; } }
</style>
<main>
  <h1>圆塔中段剖面 · 新定义候选</h1>
  <div class="controls">
    <label>下圈半径 R（米）<input id="radius" type="number" min="0.1" step="0.1" value="9"></label>
    <label>上圈半径 r（米）<input id="cap" type="number" min="0.01" step="0.1" value="1"></label>
    <label>中段高 H（米）<input id="height" type="number" min="0.1" step="0.1" value="2"></label>
    <label class="bulge">隆起高度 d：<output id="value"></output><input id="bulge" aria-label="隆起高度" type="range" min="0" max="0.5" step="0.001" value="0.2"></label>
  </div>
  <div class="legend">
    <span><i class="swatch" style="--color:#007c83"></i>当前曲线</span>
    <span><i class="swatch" style="--color:#8b959f"></i>直线基准</span>
    <label><input id="compare" type="checkbox" checked>对照曲线</label>
    <span><i class="swatch" style="--color:#2862c7"></i>d = 0.10H</span>
    <span><i class="swatch" style="--color:#b33d77"></i>d = 0.20H</span>
    <span><i class="swatch" style="--color:#b86b13"></i>d = 0.25H</span>
  </div>
  <p id="error" role="status"></p>
  <canvas id="profile" aria-label="上下连接圈之间的对称轴剖面，横纵坐标采用相同米制比例"></canvas>
</main>
<script>
  const ids = ['radius', 'cap', 'height', 'bulge', 'compare'];
  const fields = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const canvas = document.getElementById('profile');
  function draw() {
    const R = fields.radius.valueAsNumber, r = fields.cap.valueAsNumber, H = fields.height.valueAsNumber;
    const valid = Number.isFinite(R + r + H) && R > r && r > 0 && H > 0;
    document.getElementById('error').textContent = valid ? '' : '请输入有效尺寸：下圈半径大于上圈半径，且各尺寸大于零。';
    if (!valid) return;
    const limit = Math.floor(H / 4 * 1000) / 1000;
    fields.bulge.max = limit;
    const d = Math.min(fields.bulge.valueAsNumber, limit);
    fields.bulge.value = d;
    document.getElementById('value').textContent = `${d.toFixed(3)} 米（${(100 * d / H).toFixed(1)}% H）；上限 ${limit.toFixed(3)} 米`;
    const width = canvas.clientWidth, height = canvas.clientHeight, ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
    const ctx = canvas.getContext('2d'); ctx.scale(ratio, ratio);
    const margin = width < 600 ? 44 : 74;
    const scale = Math.min((width - margin * 2) / (2 * R), (height - 120) / H);
    const cx = width / 2, bottom = (height + H * scale) / 2;
    const X = x => cx + x * scale, Y = z => bottom - z * scale;
    function line(points, color, weight = 1, dash = []) {
      ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = weight; ctx.setLineDash(dash);
      points.forEach(([x,z], i) => i ? ctx.lineTo(X(x),Y(z)) : ctx.moveTo(X(x),Y(z)));
      ctx.stroke(); ctx.setLineDash([]);
    }
    function profile(amount, color, weight) {
      for (const sign of [-1, 1]) {
        const points = Array.from({length: 201}, (_, i) => {
          const t = i / 200;
          return [sign * (R - (R-r)*t), H*t + 4*amount*t*(1-t)];
        });
        line(points, color, weight);
      }
    }
    ctx.font = '13px "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#637080';
    line([[0,-0.1*H],[0,1.1*H]], '#c4ccd4', 1, [3,4]);
    line([[-R,0],[R,0]], '#d4dbe2'); line([[-r,H],[r,H]], '#d4dbe2');
    profile(0, '#8b959f', 1.5);
    if (fields.compare.checked) {
      profile(.1*H, '#2862c7', 1.5); profile(.2*H, '#b33d77', 1.5); profile(.25*H, '#b86b13', 1.5);
    }
    profile(d, '#007c83', 3);
    const middle = (R+r)/2;
    line([[middle,H/2],[middle,H/2+d]], '#20252b', 2);
    for (const z of [H/2,H/2+d]) line([[middle-.08*R,z],[middle+.08*R,z]], '#20252b');
    ctx.fillStyle = '#20252b';
    const label = `d = ${d.toFixed(3)} m`;
    ctx.fillText(label, Math.min(X(middle)+8, width-ctx.measureText(label).width-8), Y(H/2+d)-12);
    ctx.fillText(`上圈  r = ${r.toFixed(2)} m`, X(r)+8, Y(H)-16);
    ctx.fillText(`下圈  R = ${R.toFixed(2)} m`, X(R)-110, Y(0)+26);
    ctx.fillStyle = '#637080'; ctx.fillText('轴剖面 · 横纵同尺度', 12, 25);
    ctx.fillText(`H = ${H.toFixed(2)} m`, 12, height-16);
  }
  ids.forEach(id => fields[id].addEventListener('input', draw));
  new ResizeObserver(draw).observe(canvas);
  draw();
</script>
</html>
